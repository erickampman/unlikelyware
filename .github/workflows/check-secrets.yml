# Checks the signing secrets in the release environment without building or signing anything
# (SIGNING-SETUP.md step 11). Run it by hand: Actions -> Check signing secrets -> Run workflow,
# then approve the release environment. Each step fails if its secrets are wrong.
name: Check signing secrets
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    environment: release
    steps:
      - name: Notary key, key ID and issuer ID
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key"
          # Apple accepts the key only if the .p8, its key ID and the issuer ID all match.
          xcrun notarytool history --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" > history.txt
          echo "Notary credentials accepted; $(grep -c 'id:' history.txt || true) past submissions listed."
      - name: Certificate, its password and team ID
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          kc="$RUNNER_TEMP/check.keychain-db"
          p12="$RUNNER_TEMP/cert.p12"
          kcpw=$(uuidgen)
          trap 'rm -f "$p12"; security delete-keychain "$kc" 2>/dev/null || true' EXIT
          security create-keychain -p "$kcpw" "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          # Fails if the .p12 is damaged or the password is wrong.
          security import "$p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security find-identity -p codesigning "$kc" > ids.txt
          grep -q "Developer ID Application: .*($APPLE_TEAM_ID)" ids.txt \
            || { echo "No Developer ID Application identity for APPLE_TEAM_ID in the .p12"; exit 1; }
          echo "Certificate, password and team ID match."
